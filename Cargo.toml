[package]
name = "creator-commerce-metrics"
version = "0.1.0"
edition = "2021"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }

[lib]
name = "creator_commerce_metrics"
path = "src/metrics_service.rs"

[[bin]]
name = "report_creator_metrics"
path = "src/report_creator_metrics.rs"
